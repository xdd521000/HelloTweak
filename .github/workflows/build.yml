name: Build HelloTweak
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          "$THEOS/setup.sh" || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Build
        run: |
          make clean
          make package
      - uses: actions/upload-artifact@v4
        with:
          name: HelloTweak-deb
          path: packages/*.deb
